# Builds Isle on a GitHub-hosted Mac and publishes Isle.dmg as a GitHub Release.
#
# Run it from the Actions tab: Release ▸ Run workflow, and type the version.
# The website's Download button points at releases/latest/download/Isle.dmg,
# so once this finishes, the website hands out the new version.
#
# If the build fails, nothing is published and the website keeps the old version.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.3"
        required: true
        default: "1.3"
      prerelease:
        description: "Test build only (pre-release: the website keeps the current version)"
        type: boolean
        default: false
      replace:
        description: "Replace this version if it already exists (deletes it first, so the website falls back to the previous version until the new build is out)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is new
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
            echo "::error::Version must look like 1.2 or 1.2.1, got '$VERSION'"
            exit 1
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            if [ "${{ inputs.replace }}" = "true" ]; then
              echo "Deleting the existing v$VERSION so it can be rebuilt."
              gh release delete "v$VERSION" --cleanup-tag --yes
            else
              echo "::error::Release v$VERSION already exists. Pick a new version number, or tick Replace."
              exit 1
            fi
          fi

      # Isle uses the macOS 26 SDK (Liquid Glass in the onboarding window), so
      # build with the newest Xcode on the machine, not the image's default.
      - name: Pick the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          newest="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
          major="$(xcodebuild -version | awk 'NR==1{split($2,v,"."); print v[1]}')"
          if [ "$major" -lt 26 ]; then
            echo "::error::Isle needs Xcode 26 or later; the newest here is $(xcodebuild -version | head -1)."
            exit 1
          fi

      - name: Build the disk image
        run: ./Packaging/make-dmg.sh

      - name: Check the build
        run: |
          test -f dist/Isle.dmg
          ls -lh dist/Isle.dmg
          # Look inside the disk image: the app must have its executable.
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/Isle.dmg >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null 2>&1 || true' EXIT
          test -x "$mnt/Isle.app/Contents/MacOS/Isle"
          file "$mnt/Isle.app/Contents/MacOS/Isle"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$mnt/Isle.app/Contents/Info.plist"

      - name: Keep the disk image with this run
        uses: actions/upload-artifact@v4
        with:
          name: Isle-${{ inputs.version }}
          path: dist/Isle.dmg
          if-no-files-found: error

      - name: Publish the release
        run: |
          cat > notes.md <<'NOTES'
          ## New: one way to notify

          Every notification now arrives the same way. A drop leaves the side of the notch carrying the icon, and one line of text falls below it as a second drop. Then the icon flows back, the text rises, and the island tucks in. Battery, headphones, Focus, calendar, song changes and your own `isle://notify` commands all work like this, and the motion is smoother throughout.

          The Liquid split setting is gone, since this is now the only style. With Reduce Motion on, there's no drop, so only the text shows. Long messages are cut to one line.

          Also fixed: the low-battery warning no longer repeats each time Isle restarts.

          ## Installing

          Open `Isle.dmg` and drag Isle into Applications. The first time only, macOS will stop it: open System Settings ▸ Privacy & Security, scroll down and click **Open Anyway** next to Isle.
          NOTES
          flags=()
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "v$VERSION" dist/Isle.dmg \
            --target "$GITHUB_SHA" \
            --title "Isle $VERSION" \
            --notes-file notes.md \
            "${flags[@]}"
